name: Release

on:
  push:
    branches: [release]

permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: write # Required to create the release tag

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:coverage

  publish:
    runs-on: self-hosted
    needs: test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Resolve package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Skip if release tag already exists
        id: tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.tag.outputs.exists == 'false'
        run: npm publish # OIDC trusted publishing — no NPM_TOKEN
      - name: Expose tag for next job
        id: out
        run: |
          echo "tag=${{ steps.tag.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "published=${{ steps.tag.outputs.exists == 'false' }}" >> "$GITHUB_OUTPUT"
    outputs:
      tag: ${{ steps.out.outputs.tag }}
      published: ${{ steps.out.outputs.published }}

  tag:
    runs-on: self-hosted
    needs: publish
    if: needs.publish.outputs.published == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.publish.outputs.tag }}"
          git push origin "${{ needs.publish.outputs.tag }}"
